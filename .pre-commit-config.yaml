repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: atlas-eslint
        name: Atlas ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx)$

      - id: atlas-prisma-validate
        name: Atlas Prisma Validate
        entry: bash -c 'cd server && npx prisma validate'
        language: system
        pass_filenames: false
        files: ^server/prisma/schema\.prisma$

      - id: atlas-role-binding-tests
        name: Atlas Role Binding Tests
        entry: npm test --workspace=server -- roleMembers roleMembershipResolver
        language: system
        pass_filenames: false
        files: ^(server/src/(routes/roleMembers|utils/roleMembershipResolver)(\.test)?\.ts|server/prisma/schema\.prisma)$
